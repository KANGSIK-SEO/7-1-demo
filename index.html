<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollard Quantum Verification (Lite)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- No external JS library dependencies -->
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">
            <div>Evollard AI</div>
            <div class="status-bar" id="status-bar">Neural Engine Idle</div>
        </div>

        <div id="chat-log" class="chat-log">
            <div class="message bot">
                🤖 Welcome to Evollard Lite.<br>
                Please upload an image to verify authenticity.<br>
                If you make a mistake, type 'STOP' immediately.
            </div>
        </div>

        <div class="input-area">
            <input type="file" id="file-input" accept="image/*">
            <button id="upload-btn" title="Upload Image">📷</button>
            <input type="text" id="message-input" placeholder="Type message or 'STOP'..." autocomplete="off">
            <button id="send-btn" title="Send">➤</button>
        </div>
    </div>

    <script>
        // --- Core Logic: Lightweight Simulation Engine ---

        let activeProcess = null; // Stores the current timeout ID
        const steps = [
            "🔍 Analyzing image structure...",
            "🌌 Initializing Quantum Kernel...",
            "🎨 Extracting stylistic features (Brushstroke Analysis)...",
            "📜 Cross-referencing Provenance Blockchain...",
            "🧪 Performing Pigment Chemical Simulation...",
            "✅ Calculating Authenticity Probability..."
        ];

        const chatLog = document.getElementById("chat-log");
        const statusText = document.getElementById("status-bar");
        const messageInput = document.getElementById("message-input");
        const fileInput = document.getElementById("file-input");

        function appendMessage(sender, text, type = "text") {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            if (type === "error") msgDiv.classList.add("error");
            if (type === "success") msgDiv.classList.add("success");
            if (type === "system") {
                msgDiv.className = "system"; // Override class
                if (sender === "error") msgDiv.classList.add("error");
                if (sender === "success") msgDiv.classList.add("success");
            }

            msgDiv.innerHTML = text; // Allow HTML for line breaks
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Handles the "STOP" command
        function handleCancel() {
            if (activeProcess) {
                clearTimeout(activeProcess);
                activeProcess = null;
                statusText.innerText = "Engine Aborted";
                appendMessage("error", "🛑 Verification process ABORTED by user request.", "system");
                appendMessage("bot", "Resources released. No charges applied. Waiting for correct image.");
                return true;
            }
            return false;
        }

        // Simulates the long quantum process
        function runVerification(stepIndex = 0) {
            if (stepIndex >= steps.length) {
                // Finished
                const isFake = Math.random() < 0.3; // 30% chance of fake for demo
                const result = isFake
                    ? "🚨 Result: Likely FORGERY (98.4% confidence)"
                    : "✅ Result: AUTHENTIC (99.9% confidence)";

                appendMessage(isFake ? "error" : "success", result, "system");
                statusText.innerText = "Verification Complete";
                activeProcess = null;
                return;
            }

            statusText.innerText = "Processing... Step " + (stepIndex + 1);
            appendMessage("bot", steps[stepIndex]);

            // Schedule next step (2 seconds delay)
            activeProcess = setTimeout(() => {
                runVerification(stepIndex + 1);
            }, 2000);
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (!msg) return;

            appendMessage("user", msg);
            messageInput.value = "";

            // Check for cancellation keywords
            const cancelKeywords = ["stop", "cancel", "no", "wait", "halt", "wrong"];
            if (cancelKeywords.some(k => msg.toLowerCase().includes(k))) {
                if (!handleCancel()) {
                    appendMessage("bot", "There is no active process to cancel.");
                }
            }
        }

        // Event Listeners
        document.getElementById("send-btn").addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        document.getElementById("upload-btn").addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                // 1. Cancel any existing process automatically
                if (activeProcess) {
                    clearTimeout(activeProcess);
                    appendMessage("system", "⚠️ Previous task cancelled for new request.", "system");
                }

                // 2. Start new process
                appendMessage("user", `[Uploaded: ${file.name}]`);
                appendMessage("bot", `Received '${file.name}'. Starting Quantum Verification...`);
                fileInput.value = ""; // Reset input

                // Start simulation loop
                activeProcess = setTimeout(() => runVerification(0), 1000);
            }
        });

    </script>

</body>

</html>
